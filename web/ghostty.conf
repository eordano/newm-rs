# The newm-rs author's Ghostty settings, for reference: the demo's terminals are foot and
# Alacritty, with these settings carried over in foot.ini and alacritty.toml. Ghostty 1.3 draws
# with desktop OpenGL 4.3 (std430 storage buffers, rectangle textures, GLES turned off in GTK),
# which the browser guest cannot give it short of Mesa's software renderer on the guest's CPUs:
# its GL is Mesa's virgl over WebGL2 (GLES 3.0), and Zink over the guest's WebGPU Vulkan driver
# needs timeline semaphores, which that driver does not have.

font-family = FiraCode Nerd Font
font-size = 10
font-style = Medium
background-opacity = 0.85
window-padding-x = 5
window-padding-y = 5
window-decoration = true
window-show-tab-bar = never
mouse-scroll-multiplier = 0.2
shell-integration-features = sudo
copy-on-select = clipboard
confirm-close-surface = always
clipboard-read = allow
clipboard-write = allow
app-notifications = no-clipboard-copy

background = #181818
foreground = #d8d8d8
palette = 0=#181818
palette = 1=#ac4242
palette = 2=#90a959
palette = 3=#f4bf75
palette = 4=#6a9fb5
palette = 5=#aa759f
palette = 6=#75b5aa
palette = 7=#d8d8d8
palette = 8=#6b6b6b
palette = 9=#c55555
palette = 10=#aac474
palette = 11=#feca88
palette = 12=#82b8c8
palette = 13=#c28cb8
palette = 14=#93d3c3
palette = 15=#f8f8f8

keybind = performable:ctrl+c=copy_to_clipboard
keybind = alt+c=copy_to_clipboard
keybind = alt+k=text:\x0b

# Ctrl+Tab, Ctrl+Shift+Tab and Ctrl+<digit> as CSI 27;<mod>;<code>~, which tmux.conf binds to
# next/previous window and window 1..9.
keybind = ctrl+tab=csi:27;5;9~
keybind = ctrl+shift+tab=csi:27;6;9~
keybind = ctrl+1=csi:27;5;49~
keybind = ctrl+2=csi:27;5;50~
keybind = ctrl+3=csi:27;5;51~
keybind = ctrl+4=csi:27;5;52~
keybind = ctrl+5=csi:27;5;53~
keybind = ctrl+6=csi:27;5;54~
keybind = ctrl+7=csi:27;5;55~
keybind = ctrl+8=csi:27;5;56~
keybind = ctrl+9=csi:27;5;57~
