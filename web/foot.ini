# The demo's terminal: the newm-rs author's terminal settings (colours, padding, the keys tmux
# reads for window switching), on foot, which draws without GL. alacritty.toml has the same for
# the full session's GPU terminal; ghostty.conf has their Ghostty settings and says why it cannot
# draw in the browser guest.

[main]
font=monospace:size=10
pad=5x5

[mouse]
hide-when-typing=yes

[colors-dark]
background=181818
foreground=d8d8d8
regular0=181818
regular1=ac4242
regular2=90a959
regular3=f4bf75
regular4=6a9fb5
regular5=aa759f
regular6=75b5aa
regular7=d8d8d8
bright0=6b6b6b
bright1=c55555
bright2=aac474
bright3=feca88
bright4=82b8c8
bright5=c28cb8
bright6=93d3c3
bright7=f8f8f8

# Ctrl+Tab, Ctrl+Shift+Tab and Ctrl+<digit> as CSI 27;<mod>;<code>~, which tmux.conf binds to
# next/previous window and window 1..9.
[text-bindings]
\x1b[27;5;9~=Control+Tab
\x1b[27;6;9~=Control+Shift+ISO_Left_Tab
\x1b[27;5;49~=Control+1
\x1b[27;5;50~=Control+2
\x1b[27;5;51~=Control+3
\x1b[27;5;52~=Control+4
\x1b[27;5;53~=Control+5
\x1b[27;5;54~=Control+6
\x1b[27;5;55~=Control+7
\x1b[27;5;56~=Control+8
\x1b[27;5;57~=Control+9
