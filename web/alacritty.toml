# The full demo's GPU terminal: the newm-rs author's terminal settings (colours, padding, the keys
# tmux reads for window switching, as in foot.ini) on Alacritty, which draws with OpenGL ES, so in
# the browser guest it draws on the page's WebGL2 through Mesa's virgl driver.

[font]
normal = { family = "monospace" }
size = 10.0

[window]
padding = { x = 5, y = 5 }
decorations = "None"

[mouse]
hide_when_typing = true

[colors.primary]
background = "#181818"
foreground = "#d8d8d8"

[colors.normal]
black = "#181818"
red = "#ac4242"
green = "#90a959"
yellow = "#f4bf75"
blue = "#6a9fb5"
magenta = "#aa759f"
cyan = "#75b5aa"
white = "#d8d8d8"

[colors.bright]
black = "#6b6b6b"
red = "#c55555"
green = "#aac474"
yellow = "#feca88"
blue = "#82b8c8"
magenta = "#c28cb8"
cyan = "#93d3c3"
white = "#f8f8f8"

# Ctrl+Tab, Ctrl+Shift+Tab and Ctrl+<digit> as CSI 27;<mod>;<code>~, which tmux.conf binds to
# next/previous window and window 1..9.
[keyboard]
bindings = [
  { key = "Tab", mods = "Control", chars = "\u001b[27;5;9~" },
  { key = "Tab", mods = "Control|Shift", chars = "\u001b[27;6;9~" },
  { key = "Key1", mods = "Control", chars = "\u001b[27;5;49~" },
  { key = "Key2", mods = "Control", chars = "\u001b[27;5;50~" },
  { key = "Key3", mods = "Control", chars = "\u001b[27;5;51~" },
  { key = "Key4", mods = "Control", chars = "\u001b[27;5;52~" },
  { key = "Key5", mods = "Control", chars = "\u001b[27;5;53~" },
  { key = "Key6", mods = "Control", chars = "\u001b[27;5;54~" },
  { key = "Key7", mods = "Control", chars = "\u001b[27;5;55~" },
  { key = "Key8", mods = "Control", chars = "\u001b[27;5;56~" },
  { key = "Key9", mods = "Control", chars = "\u001b[27;5;57~" },
]
