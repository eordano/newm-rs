# The demo's tmux config: the newm-rs author's own, without what ties it to their machines.
# The demo session (demo.nix) appends the plugins' run-shell lines.

set  -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:hyperlinks"        # OSC 8: clickable links (rg, ls, grep)
set -as terminal-features ",*:usstyle"           # colored undercurl for LSP diagnostics
set -as terminal-features ",*:sync"              # synchronized output, no tearing
set -as terminal-features ",*:osc7"              # CWD reports — Ghostty opens new tabs in $PWD
set -as terminal-features ",*:overline"
set -as terminal-features ",*:strikethrough"
set -as terminal-features ",*:notifications"     # OSC 9 / OSC 777 desktop notifications

# Let DCS-wrapped escapes (OSC 9 notifications, etc.) reach the outer terminal.
set -g allow-passthrough on

# Forward terminal focus in/out events to applications (nvim autoread, etc.)
set -g focus-events on

# The active pane's title goes to the outer terminal as "host: title"; a pane nothing has
# titled shows its command instead.
set -g set-titles on
set -g set-titles-string "#{host_short}: #{?#{==:#{pane_title},#{host}},#{pane_current_command},#{pane_title}}"

set  -g base-index      1
setw -g pane-base-index 1

set -g status-keys vi
set -g mode-keys   vi
set -g set-clipboard on

set-option -g prefix C-a
set-option -g prefix2 C-b
unbind-key C-a
bind-key C-a send-prefix
unbind-key C-b
bind-key C-b send-prefix

setw -g mouse on

set -g renumber-windows on

setw -g monitor-activity off
set -g visual-activity off

set -sg escape-time 0

setw -g pane-base-index 1

# split window and fix path for tmux 1.9
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind | split-window -h
bind - split-window -v

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Browser-style window switching, for a terminal that sends Ctrl+Tab, Ctrl+Shift+Tab and
# Ctrl+<digit> as CSI 27;<mod>;<code>~ (ghostty.conf here), which tmux reads as C-Tab, C-BTab
# and C-1..C-9.
bind -n C-Tab  next-window
bind -n C-BTab previous-window
bind -n C-1 select-window -t :=1
bind -n C-2 select-window -t :=2
bind -n C-3 select-window -t :=3
bind -n C-4 select-window -t :=4
bind -n C-5 select-window -t :=5
bind -n C-6 select-window -t :=6
bind -n C-7 select-window -t :=7
bind -n C-8 select-window -t :=8
bind -n C-9 select-window -t :=9

bind -r H resize-pane -L 6
bind -r J resize-pane -D 6
bind -r K resize-pane -U 6
bind -r L resize-pane -R 6

bind-key x kill-pane

bind-key S-Left swap-window -t -1\; select-window -t -1
bind-key S-Right swap-window -t +1\; select-window -t +1

bind-key + swap-pane -t '~' \; select-pane -M

bind ^r refresh-client

bind Enter copy-mode
bind b list-buffers
bind B choose-buffer
bind p paste-buffer

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi C-g send-keys -X cancel
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line

set-option -s escape-time 0

# 24-hour clock (Nord theme reads this)
set -g clock-mode-style 24
